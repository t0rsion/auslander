[package]
name = "auslander-py"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for the auslander representation-theory library"
repository = "https://github.com/t0rsion/auslander"
publish = false

[lib]
name = "auslander_py"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
auslander = { path = "../auslander", version = "0.9.0" }
pyo3 = { workspace = true }
