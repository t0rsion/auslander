[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "auslander"
version = "0.9.0"
description = "Finite-dimensional bound quiver algebras kQ/I over prime fields, and their right modules"
authors = [{ name = "Tor Kringeland" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["quiver", "representation theory", "algebra", "homological algebra", "mathematics"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
display = ["networkx>=3.0"]
test = [
    "pytest>=8.0",
    "networkx>=3.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/t0rsion/auslander"
Repository = "https://github.com/t0rsion/auslander"
Documentation = "https://github.com/t0rsion/auslander/tree/main/crates/auslander-py#readme"
Changelog = "https://github.com/t0rsion/auslander/blob/main/CHANGELOG.md"
Issues = "https://github.com/t0rsion/auslander/issues"

[project.scripts]
auslander = "auslander.__main__:main"

[tool.maturin]
features = ["extension-module"]
module-name = "auslander._core"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.maturin.sbom]
# Generated Rust dependency reports contain absolute checkout paths.
rust = false
