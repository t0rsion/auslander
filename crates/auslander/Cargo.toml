[package]
name = "auslander"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Computational representation theory of finite-dimensional bound quiver algebras"
repository = "https://github.com/t0rsion/auslander"
documentation = "https://docs.rs/auslander"
readme = "../../README.md"
keywords = ["quiver", "representation", "algebra", "homology", "mathematics"]
categories = ["mathematics", "science"]

[dependencies]
rustc-hash = "2.0"

[features]
# Exact call counters in the primitives. See `src/profile.rs`. Off by default;
# no released build carries them.
profiling = []

[[bench]]
name = "perf"
harness = false
