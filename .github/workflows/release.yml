name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches every manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in crates/auslander/Cargo.toml crates/auslander-py/Cargo.toml crates/auslander-py/pyproject.toml; do
            grep -q "^version = \"$TAG\"$" "$f" || { echo "$f does not declare version $TAG"; exit 1; }
          done

  preflight:
    needs: check-version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to lie on the tested main history
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test the workspace at the tag
        run: cargo +1.92.0 test --workspace --locked
      - name: Package and test inside the extracted package
        run: |
          cargo +1.92.0 package -p auslander
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/auslander-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/auslander-*
          cargo +1.88.0 test

  wheels:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2014"
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/auslander-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/auslander-py/dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/auslander-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/auslander-py/dist

  wheel-smoke:
    # Installs the built wheel and runs the Python suite on each OS. The
    # linux-aarch64 wheel has no matching runner here and is not smoke-tested.
    needs: wheels
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
      - name: Install the wheel and run the Python tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist auslander
          python -m pytest crates/auslander-py/tests/test_smoke.py

  crates-io:
    # Publication is irreversible, so every fallible build and test job runs
    # first; a wheel failure must not leave crates.io ahead of PyPI.
    needs: [preflight, wheels, wheel-smoke, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Publish unless this version is already on crates.io
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -sf -A "auslander-release-ci" "https://crates.io/api/v1/crates/auslander/$V" > /dev/null; then
            echo "auslander $V already published; skipping"
          else
            cargo +1.92.0 publish -p auslander
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: [preflight, crates-io, wheels, wheel-smoke, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
