name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  QPA_COMMIT: 46f8bdac5f64e8a1df17ebb5a667c61fae781bed
  GBNP_COMMIT: 6e7171d90aa1ea803029ae0d290b688899965785

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest versions
        run: |
          files=(
            crates/auslander/Cargo.toml
            crates/auslander-py/Cargo.toml
            crates/auslander-py/pyproject.toml
          )
          versions=()
          for file in "${files[@]}"; do
            version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' "$file" | head -n 1)
            test -n "$version" || { echo "$file has no version"; exit 1; }
            versions+=("$version")
          done
          test "${versions[0]}" = "${versions[1]}" || {
            echo "Cargo package versions differ"
            exit 1
          }
          test "${versions[0]}" = "${versions[2]}" || {
            echo "Cargo and Python package versions differ"
            exit 1
          }
          citation_version=$(sed -n 's/^version: //p' CITATION.cff)
          test "${versions[0]}" = "$citation_version" || {
            echo "Package and citation versions differ"
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            case "$GITHUB_REF_NAME" in
              v*) tag_version="${GITHUB_REF_NAME#v}" ;;
              *) echo "push ref is not a version tag"; exit 1 ;;
            esac
            test "${versions[0]}" = "$tag_version" || {
              echo "tag $GITHUB_REF_NAME does not match version ${versions[0]}"
              exit 1
            }
          else
            echo "Rehearsal version: ${versions[0]}"
          fi

  preflight:
    needs: check-version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to lie on main history
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test the workspace at the selected ref
        run: cargo +1.92.0 test --workspace --locked -- --include-ignored
      - name: Package and test inside the extracted package
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 2
        run: |
          cargo +1.92.0 package -p auslander
          PKG_DIR=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")/pkg
          mkdir -p "$PKG_DIR"
          tar xzf target/package/auslander-*.crate -C "$PKG_DIR"
          cd "$PKG_DIR"/auslander-*
          cargo +1.88.0 test -- --include-ignored

  msrv:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test the workspace with the minimum supported Rust
        run: cargo +1.88.0 test --workspace --locked
      - name: Check with a fresh dependency resolution
        run: |
          rm Cargo.lock
          cargo +1.88.0 check --workspace

  quality:
    needs: check-version
    uses: ./.github/workflows/quality.yml

  qpa-oracle:
    needs: [check-version, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install GAP
        run: |
          sudo apt-get update
          sudo apt-get install -y gap
      - name: Install pinned QPA and gbnp
        run: |
          mkdir -p "$HOME/.gap/pkg"
          for spec in \
            "qpa https://github.com/gap-packages/qpa.git $QPA_COMMIT" \
            "gbnp https://github.com/gap-packages/gbnp.git $GBNP_COMMIT"; do
            read -r name url commit <<< "$spec"
            target="$HOME/.gap/pkg/$name"
            git init "$target"
            git -C "$target" remote add origin "$url"
            git -C "$target" fetch --depth 1 origin "$commit"
            git -C "$target" checkout --detach "$commit"
            test "$(git -C "$target" rev-parse HEAD)" = "$commit"
          done
      - name: Run the live QPA oracle at the selected ref
        run: QPA_ORACLE=1 cargo +1.92.0 test -p auslander --test qpa_oracle

  wheels:
    needs: check-version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
          - runner: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Remap wheel build paths
        shell: python
        run: |
          import os
          from pathlib import Path
          prefixes = [(str(Path.home()), "/build-home"), (os.environ["GITHUB_WORKSPACE"], "/source"), ("/root", "/build-home")]
          flags = " ".join(f"--remap-path-prefix={source}={target}" for source, target in prefixes)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RUSTFLAGS={flags}\n")
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/auslander-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: crates/auslander-py/dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/auslander-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/auslander-py/dist

  wheel-tests:
    needs: wheels
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            python-version: "3.10"
          - runner: ubuntu-latest
            target: x86_64
            python-version: "3.12"
          - runner: ubuntu-24.04-arm
            target: aarch64
            python-version: "3.12"
          - runner: macos-latest
            target: universal2-apple-darwin
            python-version: "3.12"
          - runner: macos-15-intel
            target: universal2-apple-darwin
            python-version: "3.12"
          - runner: windows-latest
            target: x64
            python-version: "3.12"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - name: Install the wheel and run the Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0" "networkx>=3.0" "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6.0"
          python -m pip install --no-index --find-links dist "auslander[test]"
          python -m pytest crates/auslander-py/tests

  sdist-test:
    needs: sdist
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Install the sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/auslander-sdist"
          sdist_files=(dist/auslander-*.tar.gz)
          "$RUNNER_TEMP/auslander-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/auslander-sdist/bin/python" -m pip install --no-cache-dir \
            "auslander[test] @ file://$PWD/${sdist_files[0]}"
      - name: Run the Python tests against the installed sdist
        run: |
          "$RUNNER_TEMP/auslander-sdist/bin/python" -m pytest crates/auslander-py/tests

  crates-io:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, preflight, msrv, qpa-oracle, wheels, wheel-tests, sdist, sdist-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Publish unless this version is already on crates.io
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -sf -A "auslander-release-ci" "https://crates.io/api/v1/crates/auslander/$V" > /dev/null; then
            echo "auslander $V already published; skipping"
          else
            cargo +1.92.0 publish -p auslander
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [crates-io]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Compute checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
