name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    uses: ./.github/workflows/quality.yml

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo +1.92.0 test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 test --workspace --locked
      - name: Check with a fresh resolution
        run: |
          rm Cargo.lock
          cargo +1.88.0 check --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.92.0 package -p auslander
      - name: Test inside the extracted package
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 2
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/auslander-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/auslander-*
          cargo +1.88.0 test

  wheel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remap wheel build paths
        shell: python
        run: |
          import os
          from pathlib import Path
          prefixes = [(str(Path.home()), "/build-home"), (os.environ["GITHUB_WORKSPACE"], "/source"), ("/root", "/build-home")]
          flags = " ".join(f"--remap-path-prefix={source}={target}" for source, target in prefixes)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RUSTFLAGS={flags}\n")
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/auslander-py
          target: x86_64
          manylinux: "2014"
          args: --release --strip --out dist
      - name: Install the wheel and run the Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0" "networkx>=3.0" "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6.0"
          python -m pip install --no-index --find-links crates/auslander-py/dist "auslander[test]"
          python -m pytest crates/auslander-py/tests
      - name: Build, install, and test the source distribution
        env:
          RUSTUP_TOOLCHAIN: 1.92.0
        run: |
          python -m pip install maturin
          sdist_dir="$RUNNER_TEMP/auslander-sdist-dist"
          maturin sdist --manifest-path crates/auslander-py/Cargo.toml --out "$sdist_dir"
          sdist_files=("$sdist_dir"/auslander-*.tar.gz)
          python -m pip install --force-reinstall --no-cache-dir \
            "auslander[test] @ file://${sdist_files[0]}"
          python -m pytest crates/auslander-py/tests
