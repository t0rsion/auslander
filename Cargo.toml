[workspace]
resolver = "3"
members = ["crates/auslander", "crates/auslander-py", "crates/auslander-wasm"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310", "multiple-pymethods"] }

[profile.dev]
opt-level = 2

# Sampling with `perf record` needs debug information in `benches/perf.rs`.
# The release profile keeps its default of no debug information.
[profile.perf]
inherits = "release"
debug = true

# The browser verifier in `web/`. `web/build.sh` builds `auslander-wasm` with it.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
