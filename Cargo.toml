[workspace]
resolver = "3"
members = ["crates/auslander", "crates/auslander-py"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.dev]
opt-level = 2

# Release code with symbols, for `perf record` over `benches/perf.rs`. Release
# itself stays stripped: a sampling profile must not change what ships.
[profile.perf]
inherits = "release"
debug = true
