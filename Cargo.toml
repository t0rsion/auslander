[workspace]
resolver = "3"
members = ["crates/auslander", "crates/auslander-py"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.dev]
opt-level = 2

# Sampling with `perf record` needs debug information in `benches/perf.rs`.
# The release profile keeps its default of no debug information.
[profile.perf]
inherits = "release"
debug = true
